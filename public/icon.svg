<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bottomBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Solid background extending to edges for maskable compatibility -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Outer Cyber Tech Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3"/>

  <!-- Glow Effect -->
  <circle cx="256" cy="256" r="160" fill="url(#cyanGlow)"/>

  <!-- Pokeball Vector Art scaled with 20% safe margin to guarantee zero logo cutting on Android/iOS/Windows -->
  <g transform="translate(102, 102) scale(0.60)">
    <!-- Top Half -->
    <path d="M 256 32 A 224 224 0 0 1 480 236 L 332 236 A 80 80 0 0 0 180 236 L 32 236 A 224 224 0 0 1 256 32 Z" fill="url(#topBall)"/>
    <!-- Bottom Half -->
    <path d="M 32 276 L 180 276 A 80 80 0 0 0 332 276 L 480 276 A 224 224 0 0 1 256 480 A 224 224 0 0 1 32 276 Z" fill="url(#bottomBall)"/>
    <!-- Center Dividing Band -->
    <line x1="32" y1="256" x2="176" y2="256" stroke="#020617" stroke-width="28" stroke-linecap="round"/>
    <line x1="336" y1="256" x2="480" y2="256" stroke="#020617" stroke-width="28" stroke-linecap="round"/>
    <!-- Center Button -->
    <circle cx="256" cy="256" r="76" fill="#020617" stroke="#22d3ee" stroke-width="10"/>
    <circle cx="256" cy="256" r="46" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>
    <circle cx="240" cy="240" r="12" fill="#ffffff"/>
  </g>
</svg>
